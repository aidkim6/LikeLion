<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout4</title>
    <link rel="stylesheet" href="../src/layout4.css">
</head>
<body>
    <div class="wrap">
        <header>
            <div class="logo"></div>
            <div class="nav"></div>
        </header>
        <main>
            <div class="main_top">
                <div class="t_left"></div>
                <div class="t_right">
                    <div class="t_right_top">
                        <div class="right1"></div>
                        <div class="right2"></div>
                    </div>
                    <div class="t_right_bottom">
                        <div class="right3"></div>
                        <div class="right4"></div>
                    </div>
                </div>
            </div>
            <div class="main_bottom">
                <div class="b_left">
                    <div class="b_left1"></div>
                    <div class="b_left2"></div>
                    <div class="b_left3"></div>
                </div>
                <div class="b_right">
                    <div class="b_right_top"></div>
                    <div class="b_right_bottom">
                        <div class="b_right1"></div>
                        <div class="b_right2"></div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <div class="left"></div>
            <div class="middle"></div>
            <div class="right"></div>
        </footer>
    </div>
</body>
</html>
