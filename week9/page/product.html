<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금융 앱 - 내 자산</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="wrap" class="asset_wrap">
        
        <header class="asset_header">
            <h1 class="asset_main_title">My Asset</h1>
            <a href="javascript:history.back();" class="close_btn">
                <img src="../assets/src/x.png" alt="닫기">
            </a>
        </header>

        <section class="total_asset_box">
            <p class="asset_sub_label">Your total asset portfolio</p>
            <div class="amount_row">
                <h2 class="total_amount">N203,935</h2>
                <span class="profit_badge">
                    <img src="../assets/src/+2.png" alt="상승" class="arrow_icon">
                </span>
            </div>
        </section>

        <section class="current_plan_section">
            <h3 class="section_title">Current Plans</h3>
            <div class="gold_card_box">
                <img src="../assets/src/Portfolio 1.png" alt="Gold Plan" class="gold_plan_img">
            </div>
            <div class="see_all_plans_box">
                <a href="#" class="see_all_plans_btn">See All Plans &rarr;</a>
            </div>
        </section>

        <section class="history_section">
            <h3 class="section_title">History</h3>
            <div class="history_list">
                
                <div class="history_item">
                    <div class="history_info">
                        <h4 class="history_price text_black">Rp 200.000</h4>
                        <p class="history_desc">Buy "APPL" Stock</p>
                    </div>
                    <span class="history_date">TUE 22 Jun 2020</span>
                </div>

                <div class="history_item">
                    <div class="history_info">
                        <h4 class="history_price text_green">Rp 150.000</h4>
                        <p class="history_desc">Sell "TLKM" Stock</p>
                    </div>
                    <span class="history_date">TUE 22 Jun 2020</span>
                </div>

                <div class="history_item">
                    <div class="history_info">
                        <h4 class="history_price text_black">Rp 1.000.240</h4>
                        <p class="history_desc">Buy "FB" Stock</p>
                    </div>
                    <span class="history_date">TUE 22 Jun 2020</span>
                </div>

                <div class="history_item">
                    <div class="history_info">
                        <h4 class="history_price text_green">Rp 1.000.240</h4>
                        <p class="history_desc">Sell "APPL" Stock</p>
                    </div>
                    <span class="history_date">TUE 22 Jun 2020</span>
                </div>

            </div>
        </section>

    
    </div>
</body>
</html>
