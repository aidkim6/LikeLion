<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금융 앱 - 알림</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="wrap" class="noti_wrap">
        

        <header class="noti_header">
            <a href="javascript:history.back();" class="back_btn">
                <img src="../assets/src/left.png" alt="뒤로가기">
            </a>
            <h1 class="noti_title">Notification</h1>
        </header>


        <main class="noti_main">
            

            <div class="noti_item">
                <img src="../assets/src/Rectangle 57.png" alt="알림 이미지1" class="noti_img">
                <div class="noti_content">
                    <p class="noti_text">Apple stocks just increased Check it out now.</p>
                    <span class="noti_time">15min ago</span>
                </div>
            </div>


            <div class="noti_item">
                <img src="../assets/src/Rectangle 58.png" alt="알림 이미지2" class="noti_img">
                <div class="noti_content">
                    <p class="noti_text">Check out today's best investor. You'll learn from him</p>
                    <span class="noti_time">3min ago</span>
                </div>
            </div>

            <div class="noti_item">
                <img src="../assets/src/Rectangle 59.png" alt="알림 이미지3" class="noti_img">
                <div class="noti_content">
                    <p class="noti_text">Where do you see yourself in the next ages.</p>
                    <span class="noti_time">30secs ago</span>
                </div>
            </div>

        </main>

    </div>
</body>
</html>
