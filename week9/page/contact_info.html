<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금융 앱 - 연락처 정보</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="wrap" class="contact_wrap">
        
        <header class="contact_header">
            <a href="javascript:history.back();" class="back_btn">
                <img src="../assets/src/left.png" alt="뒤로가기">
            </a>
            <h1 class="contact_main_title">Contact info</h1>
        </header>

        <section class="contact_avatar_section">
            <div class="avatar_container">
                <img src="../assets/src/profile.png" alt="User Avatar" class="contact_avatar">
                <div class="edit_overlay">
                    <img src="../assets/src/edit-2.png" alt="수정" class="edit_icon">
                </div>
            </div>
        </section>

        <main class="contact_form">
            
            <div class="form_group">
                <div class="input_box">
                    <label class="input_label">Name</label>
                    <input type="text" class="input_field" value="Warren Buffet">
                </div>
                <button type="button" class="change_btn">Change</button>
            </div>

            <div class="form_group">
                <div class="input_box">
                    <label class="input_label">Birthdate</label>
                    <input type="text" class="input_field" value="05 November 1993">
                </div>
                <button type="button" class="change_btn">Change</button>
            </div>

            <div class="form_group">
                <div class="input_box">
                    <label class="input_label">Gender</label>
                    <input type="text" class="input_field" value="Male">
                </div>
                <button type="button" class="change_btn">Change</button>
            </div>

            <div class="form_group">
                <div class="input_box">
                    <label class="input_label">Email</label>
                    <input type="email" class="input_field" value="warren.buff@invest.ai">
                </div>
                <button type="button" class="change_btn">Change</button>
            </div>

            <div class="form_group no_btn">
                <div class="input_box">
                    <label class="input_label">Phone Number</label>
                    <input type="text" class="input_field" value="-">
                </div>
            </div>

            <div class="form_group no_btn">
                <div class="input_box">
                    <label class="input_label">Address</label>
                    <input type="text" class="input_field" value="-">
                </div>
            </div>

        </main>

    </div>
</body>
</html>
