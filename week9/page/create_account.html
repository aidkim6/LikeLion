<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금융 앱 - 계정 생성</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="wrap">
        
        <header class="create_header">
            <a href="javascript:history.back();" class="back_btn">
                <img src="../assets/src/left.png" alt="뒤로가기 화살표" class="back_img">
            </a>
        </header>

        <main class="create_main">
            <div class="title_group">
                <h1 class="create_title">Create an account</h1>
                <p class="create_sub">Invest and double your income now</p>
            </div>

            <form class="register_form">
                <input type="text" placeholder="Full name" class="form_input">
                <input type="email" placeholder="Email address" class="form_input">
                <input type="password" placeholder="Password" class="form_input">
            </form>
        </main>

        <footer>
        <div class="btn_group">
            <a href="./home.html" class="create_btn" style="text-decoration: none;">Create account</a>
            
            <a href="#" class="already_btn">Already have an account?</a>
        </div>
        </footer>

    </div>
</body>
</html>
